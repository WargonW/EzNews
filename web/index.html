<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EZNews —— 轻量、自托管的新闻聚合与语音播报工具" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>EZNews</title>

    <!-- Noto Sans SC：中英文兼顾（MEMORY.md 设计偏好）。
         用 preconnect + font-display:swap，避免字体阻塞首屏渲染。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    />

    <style>
      /* 首屏加载态：JS bundle 解析完成前先占位，避免白屏闪烁。
         刻意做得极简 —— 只是品牌名 + 一条进度条，不引入额外依赖。 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        font-family: system-ui, -apple-system, 'Noto Sans SC', sans-serif;
        transition: opacity 0.2s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #020617;
          color: #e2e8f0;
        }
      }
      #boot .name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      #boot .bar {
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(148 163 184 / 0.35);
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2563eb;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- 首屏占位；React 挂载后由 main.tsx 移除 -->
    <div id="boot">
      <div class="name">EZNews</div>
      <div class="bar"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
